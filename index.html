<!DOCTYPE html>
<html>
<head>
  <title>编号生成器</title>
  <meta charset="UTF-8">
  <meta name="keywords" content="keyword1,keyword2,keyword3">
  <meta name="description" content="this is my page">
  <meta name="content-type" content="text/html; charset=US-ASCII">
  <link rel="stylesheet" type="text/css" href="bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" type="text/css" href="bootstrap-datetimepicker/css/bootstrap-datetimepicker.css" />
  <link rel="stylesheet" type="text/css" href="toastr/toastr.css" />
</head>
<body>

<div class="generator-sections-wrapper">
    <div class="generator-section" id="IDcard">
      <div class="page-header">
        <h3 style="text-align: center">身份份证号码生成</h3>
      </div>
      <form class="form-horizontal " method="get">
        <div class="form-group">
          <label class="col-sm-4 control-label">身份证号</label>
          <div class="col-sm-4">
            <input type="text" class="form-control" id="IDCard">
          </div>
        </div>
        <div class="form-group">
          <label class="col-sm-4 control-label"></label>
          <div class="col-sm-5">
            <button type="button" class="btn btn-success" id="randomGenBtn"
              onclick="randomGenId();">手气不错</button>
            <button type="button" class="btn btn-info" onclick="checkCard();">校验</button>
          </div>
        </div>
      </form>
    </div>
    <div class="generator-section" id="orgCodeDiv" style="display: none;">
      <div class="page-header">
        <h3 style="text-align: center">组织机构代码生成</h3>
      </div>
       <form class="form-horizontal " method="get">
        <div class="form-group">
          <label class="col-sm-4 control-label">组织机构代码</label>
          <div class="col-sm-3">
            <input type="text" class="form-control" id='orgCode'>
          </div>
        </div>
         <div class="form-group">
          <label class="col-sm-4 control-label"></label>
          <div class="col-sm-5">
            <button type="button" class="btn btn-success" onclick="generatorOrgCode()">生成</button>
            <button type="button" class="btn btn-info" onclick="orgCodeValidate(document.getElementById('orgCode').value)">校验</button>
          </div>
        </div>
      </form>
    </div>

    <div class="generator-section" id="creditCodeDiv">
      <div class="page-header">
        <h3 style="text-align: center">统一社会信用代码生成</h3>
      </div>
       <form class="form-horizontal " method="get">
        <div class="form-group">
          <label class="col-sm-4 control-label">统一社会信用代码</label>
          <div class="col-sm-3">
            <input type="text" class="form-control" id='creditCode'>
          </div>
        </div>
         <div class="form-group">
          <label class="col-sm-4 control-label"></label>
          <div class="col-sm-5">
            <button type="button" class="btn btn-success" onclick="generatorCreditCode();">生成</button>
            <button type="button" class="btn btn-info" onclick="isCreditCode(document.getElementById('creditCode').value);">校验</button>
          </div>
        </div>
      </form>
    </div>

    <div class="generator-section" id="phoneNoDiv">
      <div class="page-header">
        <h3 style="text-align: center">手机号码生成</h3>
      </div>
       <form class="form-horizontal " method="get">
        <div class="form-group">
          <label class="col-sm-4 control-label">手机号码</label>
          <div class="col-sm-3">
            <input type="text" class="form-control" id='phoneNo'>
          </div>
        </div>
         <div class="form-group">
          <label class="col-sm-4 control-label"></label>
          <div class="col-sm-5">
            <button type="button" class="btn btn-success" onclick="generatorPhoneNo();">生成</button>
            <button type="button" class="btn btn-info" onclick="checkMobile(document.getElementById('phoneNo').value);">校验</button>
          </div>
        </div>
      </form>
    </div>
    <div class="generator-section" id="bankaccountDiv">
      <div class="page-header">
        <h3 style="text-align: center">银行卡号生成</h3>
      </div>
       <form class="form-horizontal " method="get">
        <div class="form-group">
          <label class="col-sm-4 control-label">银行卡号</label>
          <div class="col-sm-3">
            <input type="text" class="form-control" id='bankaccount'>
          </div>
        </div>
         <div class="form-group">
          <label class="col-sm-4 control-label"></label>
          <div class="col-sm-5">
            <button type="button" class="btn btn-success" onclick="generatorBankAccount();">生成</button>
            <button type="button" class="btn btn-info" onclick="luhmCheck(document.getElementById('bankaccount').value);">校验</button>
          </div>
        </div>
      </form>
    </div>


  </div>
  </div> <!-- 关闭 .generator-sections-wrapper -->
  <style>
    .generator-sections-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 28px 32px;
      margin: 32px 2vw;
      width: 100%;
      box-sizing: border-box;
    }
    .generator-section {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin: 0;
      padding: 18px 16px 12px 16px;
      background: #fafbfc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      width: 46%;
      min-width: 340px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    @media (max-width: 900px) {
      .generator-section { width: 98%; min-width: unset; }
      .generator-sections-wrapper { gap: 16px 0; }
    }
    /* 输入框宽度更大 */
    .generator-section input[type="text"] {
      height: 38px;
      font-size: 1.08em;
      padding: 6px 12px;
      border-radius: 4px;
      margin-bottom: 6px;
      min-width: 120px;
      width: 300px;
      box-sizing: border-box;
      display: inline-block;
    }
    /* 下拉框宽度适中，且有间距 */
    .generator-section select {
      height: 38px;
      font-size: 1.08em;
      padding: 6px 12px;
      border-radius: 4px;
      margin-bottom: 6px;
      min-width: 80px;
      width: 110px;
      max-width: 100%;
      box-sizing: border-box;
      display: inline-block;
      margin-right: 10px;
    }
    .generator-section select:last-child {
      margin-right: 0;
    }
    /* 按钮宽度更窄，视觉更协调 */
    .generator-section .btn {
      min-width: 80px;
      width: 120px;
      font-size: 1.04em;
      padding: 7px 0;
      margin-bottom: 8px;
      box-sizing: border-box;
      display: inline-block;
    }
    .generator-section label.radio-inline,
    .generator-section label.control-label {
      font-size: 1.06em;
    }
    /* 让按钮组横向排列且居中 */
    .generator-section .col-sm-5 {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    /* 让输入框和下拉框在小屏下自适应 */
    @media (max-width: 700px) {
      .generator-section { width: 98%; min-width: unset; }
      .generator-sections-wrapper { gap: 16px 0; }
      .generator-section input[type="text"],
      .generator-section select {
        width: 98%;
        min-width: unset;
      }
      .generator-section .btn {
        width: 98%;
        min-width: unset;
      }
    }
  </style>
</body>
</html>
<script type="text/javascript" src="js/jquery-2.1.0.js"></script>
<script type="text/javascript" src="bootstrap/js/bootstrap.min.js"></script>
<script type="text/javascript" src="bootstrap-datetimepicker/js/bootstrap-datetimepicker.js"></script><!--日期控件-->
<script type="text/javascript" src="bootstrap-datetimepicker/js/locales/bootstrap-datetimepicker.zh-CN.js"></script><!--日期控件中文-->
<script type="text/javascript" src="toastr/toastr.js"></script><!--消息提示-->
<script type="text/javascript" src="area.js"></script><!--行政区划选择-->
<script type="text/javascript" src="areas.js"></script><!--生成编号需要的行政区划（部分）-->
<script type="text/javascript" src="idCard.js"></script><!--身份证号码生成-->
<script type="text/javascript" src="orgCode.js"></script><!--组织机构代码生成-->
<script type="text/javascript" src="creditCode.js"></script><!--统一社会信用代码生成-->
<script type="text/javascript" src="phoneNo.js"></script><!--手机号码生成-->
<script type="text/javascript" src="bankaccount.js"></script><!--银行卡号生成-->
